<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="description" content="Noema: a living world shaped by words. Chant to your colony and watch what it remembers.">
		<meta name="theme-color" content="#07080d">
		<title>Noema</title>
		<!--
			Noema's web page (the Godot Web export's custom HTML shell, export_presets.cfg
			html/custom_html_shell). It replaces Godot's loading screen with Noema's own: the engine
			downloads behind it, then it fades into the game. The $GODOT_* placeholders are filled
			in by the export; the engine wiring below follows Godot 4.6's stock shell.
		-->
		<style>
:root {
	--night: #07080d;
	--cream: #e9e4dc;
	--muted: #8f8a84;
	--rose: #d9707f;
	--mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
	--sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--cream);
	background-color: var(--night);
	overflow: hidden;
	touch-action: none;
	font-family: var(--sans);
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	z-index: 1;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.6rem;
	padding: 0 1rem;
	background:
		radial-gradient(ellipse at 50% 38%, rgba(233, 228, 220, 0.06), transparent 60%),
		var(--night);
	transition: opacity 0.8s ease;
}

#status.leaving {
	opacity: 0;
	pointer-events: none;
}

/* A few stars, drawn with one gradient each. */
#status::before {
	content: "";
	position: absolute;
	inset: 0;
	background-image:
		radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent),
		radial-gradient(1px 1px at 83% 12%, rgba(255,255,255,.5), transparent),
		radial-gradient(1px 1px at 68% 78%, rgba(255,255,255,.6), transparent),
		radial-gradient(1px 1px at 22% 84%, rgba(255,255,255,.45), transparent),
		radial-gradient(1.5px 1.5px at 91% 52%, rgba(255,255,255,.55), transparent),
		radial-gradient(1px 1px at 6% 56%, rgba(255,255,255,.5), transparent),
		radial-gradient(1px 1px at 45% 8%, rgba(255,255,255,.4), transparent),
		radial-gradient(1px 1px at 57% 92%, rgba(255,255,255,.4), transparent);
	pointer-events: none;
}

.planet {
	position: relative;
	width: clamp(110px, 28vmin, 170px);
	aspect-ratio: 1;
	border-radius: 50%;
	background: radial-gradient(circle at 36% 32%, #f1eee9 0%, #a9a6a2 38%, #3a3937 72%, #121212 100%);
	box-shadow: 0 0 60px rgba(233, 228, 220, 0.12);
	animation: breathe 6s ease-in-out infinite;
}

.planet i {
	position: absolute;
	width: 6%;
	aspect-ratio: 1;
	border-radius: 50%;
	animation: pulse 3s ease-in-out infinite;
}

.planet i:nth-child(1) { left: 30%; top: 34%; background: #e04a5c; }
.planet i:nth-child(2) { left: 40%; top: 27%; background: #e04a5c; width: 4.5%; animation-delay: .4s; }
.planet i:nth-child(3) { left: 61%; top: 42%; background: #4f7de0; animation-delay: .9s; }
.planet i:nth-child(4) { left: 70%; top: 53%; background: #4f7de0; width: 4%; animation-delay: 1.3s; }
.planet i:nth-child(5) { left: 33%; top: 60%; background: #3fb67a; animation-delay: 1.7s; }
.planet i:nth-child(6) { left: 47%; top: 71%; background: #e0b24a; width: 4%; animation-delay: 2.2s; }

.wordmark {
	position: relative;
	margin: 0;
	font-size: clamp(2rem, 7vmin, 3.2rem);
	font-weight: 300;
	letter-spacing: 0.42em;
	margin-right: -0.42em; /* the tracking after the last letter would push it off centre */
	text-transform: uppercase;
}

.tagline {
	position: relative;
	margin: -0.8rem 0 0;
	color: var(--muted);
	font-size: 0.95rem;
	font-style: italic;
}

.chant {
	position: relative;
	height: 1.2em;
	font-family: var(--mono);
	font-size: 0.8rem;
	letter-spacing: 0.3em;
	text-transform: lowercase;
	color: var(--rose);
	opacity: 0;
	transition: opacity 0.9s ease;
}

.chant.shown {
	opacity: 0.85;
}

.loader {
	position: relative;
	width: min(260px, 70vw);
	display: flex;
	flex-direction: column;
	gap: 0.6rem;
	align-items: center;
}

.bar {
	width: 100%;
	height: 2px;
	background: rgba(233, 228, 220, 0.12);
	overflow: hidden;
	border-radius: 2px;
}

.bar span {
	display: block;
	height: 100%;
	width: 0;
	background: var(--cream);
	transition: width 0.3s ease;
}

.bar.unknown span {
	width: 30%;
	animation: sweep 1.4s ease-in-out infinite;
}

#status-text {
	font-family: var(--mono);
	font-size: 0.7rem;
	letter-spacing: 0.18em;
	text-transform: uppercase;
	color: var(--muted);
}

#status-notice {
	display: none;
	position: relative;
	max-width: 28rem;
	padding: 1rem 1.2rem;
	border: 1px solid rgba(217, 112, 127, 0.5);
	border-radius: 8px;
	background: rgba(125, 19, 40, 0.25);
	color: var(--cream);
	font-size: 0.9rem;
	line-height: 1.5;
	text-align: center;
}

@keyframes breathe {
	0%, 100% { box-shadow: 0 0 50px rgba(233, 228, 220, 0.10); }
	50% { box-shadow: 0 0 80px rgba(233, 228, 220, 0.20); }
}

@keyframes pulse {
	0%, 100% { opacity: 0.95; transform: scale(1); }
	50% { opacity: 0.55; transform: scale(0.8); }
}

@keyframes sweep {
	0% { transform: translateX(-100%); }
	100% { transform: translateX(340%); }
}

@media (prefers-reduced-motion: reduce) {
	.planet, .planet i, .bar.unknown span { animation: none; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Noema needs JavaScript to run.
		</noscript>

		<div id="status">
			<div class="planet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
			<h1 class="wordmark">Noema</h1>
			<p class="tagline">What will they remember?</p>
			<div class="chant" id="status-chant" aria-hidden="true"></div>
			<div class="loader" id="status-loader">
				<div class="bar unknown" id="status-bar"><span></span></div>
				<div id="status-text">Reaching the world</div>
			</div>
			<div id="status-notice" role="alert"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoader = document.getElementById('status-loader');
	const statusBar = document.getElementById('status-bar');
	const statusFill = statusBar.firstElementChild;
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');
	const statusChant = document.getElementById('status-chant');

	let initializing = true;

	// Words drift in while the world loads, as chants do in the game.
	const words = ['remember', 'gather', 'wander', 'build', 'harmony', 'ancestors', 'bloom', 'horizon', 'dance', 'stillness', 'kin', 'rune'];
	let wordIndex = Math.floor(Math.random() * words.length);
	const chantTimer = setInterval(() => {
		statusChant.classList.remove('shown');
		setTimeout(() => {
			statusChant.textContent = words[wordIndex++ % words.length];
			statusChant.classList.add('shown');
		}, 900);
	}, 2600);
	statusChant.textContent = words[wordIndex++ % words.length];
	statusChant.classList.add('shown');

	function hideStatus() {
		if (!initializing) {
			return;
		}
		initializing = false;
		clearInterval(chantTimer);
		statusOverlay.classList.add('leaving');
		setTimeout(() => statusOverlay.remove(), 900);
	}

	function displayFailureNotice(err) {
		console.error(err);
		let text = 'Something went wrong while loading Noema.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusLoader.style.display = 'none';
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing features Noema needs:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusBar.classList.remove('unknown');
				const pct = Math.min(100, Math.floor(current / total * 100));
				statusFill.style.width = pct + '%';
				statusText.textContent = pct < 100 ? 'Downloading the world · ' + pct + '%' : 'Waking the colonies';
			} else {
				statusBar.classList.add('unknown');
				statusFill.style.width = '';
			}
		},
	}).then(hideStatus, displayFailureNotice);
}());
		</script>
	</body>
</html>
